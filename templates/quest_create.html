{% extends 'base.html' %}

{% block title %}
Create Quest
{% endblock %}

{% block create_active %}
active
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/auth.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/create.css') }}">
{% endblock %}

{% block content %}
<!-- Classe boostrap: "container-fluid": di fatto mette width: 100% a tutte le dimensioni -->
<section class="container-fluid">
    <form action="" method="POST" enctype="multipart/form-data">
        <!-- align-item-start serve siccome se no, di default, row viene gestita
         come una flexbox con proprietà align-element-stretch, ossia ogni elemento
         va ad occupare tutto lo spazio disponibile ed in tale modo avrei due
         card della stessa altezza -->
        <div class="row align-items-start justify-content-center">
            <div class="col-7">
                <div class="auth-card">
                    <h1>Quest Creation</h1>
                    <label for="title">Title*</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="Winter Shogun Incident"
                        required>

                    <label for="description">Description*</label>
                    <textarea id="description" name="description" class="form-control" rows="4"
                        placeholder="What heroic deeds are the adventurers called upon to perform?" required></textarea>

                    <div class="row">
                        <div class="col-6">
                            <label for="duration">Duration*</label>
                            <input type="number" id="duration" name="duration" class="form-control"
                                placeholder="Expressed in minutes" required>
                        </div>

                        <div class="col-6">
                            <label for="location">Location*</label>
                            <select id="location" name="location" class="form-control" required>
                                <option value=""></option>
                                <option value=""></option>
                                <option value=""></option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <label for="type">Type*</label>
                            <select id="type" name="type" class="form-control" required>
                                <option value=""></option>
                                <option value=""></option>
                                <option value=""></option>
                            </select>
                        </div>

                        <div class="col-6">
                            <label for="difficulty">Difficulty*</label>
                            <select id="difficulty" name="difficulty" class="form-control" required>
                                <option value=""></option>
                                <option value=""></option>
                                <option value=""></option>
                            </select>
                        </div>
                    </div>

                    <label for="illustration">Illustration*</label>
                    <input type="file" id="illustration" name="illustration" class="form-control"
                        accept="jpg,jpeg,webp,png" required>
                </div>
            </div>

            <div class="col-4">
                <div class="auth-card">
                    <h1>Session creation</h1>
                    <div class="create-session-card row">
                        <div class="col-6">
                            <label for="day">Day*</label>
                            <select id="day" name="day" class="form-control" required>
                                <option value=""></option>
                                <option value=""></option>
                                <option value=""></option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="start">Start*</label>
                            <input type="text" id="start" name="start" class="form-control" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center">
                        <button type="submit">Add a new session</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</section>
{% endblock %}
