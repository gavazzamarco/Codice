<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konosuba - {% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
</head>

<body class="min-vh-100">
    <div class="base-container">
        <header class="d-flex flex-wrap justify-content-between align-items-center py-2 mb-2">
            <a href="{{ url_for('home') }}" class="d-flex align-items-center text-decoration-none">
                <img src="{{ url_for('static', filename='images/logo-header.jpg') }}" class="base-logo-header" alt="Logo Konosuba">
                <span>Konosuba</span>
            </a>

            <ul class="nav nav-pills align-items-center">
                <li class="nav-item">
                    <a href="{{ url_for('home') }}" class="nav-link base-nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('login') }}" class="nav-link base-nav-link">Login</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('register') }}" class="nav-link base-nav-link">Register</a>
                </li>
            </ul>
        </header>
    </div>

    <div class="container-fluid">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{category}} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="base-footer">
        <a href="{{ url_for('home') }}" class="d-flex align-items-center text-decoration-none">
            <img src="{{ url_for('static', filename='images/logo-footer.jpg') }}" class="base-logo-footer" alt="Logo Konosuba">
        </a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
